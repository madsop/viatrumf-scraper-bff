version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  groups:
    maven:
      patterns:
        - "org.apache.maven*"
  open-pull-requests-limit: 15
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
    time: "04:30"
  open-pull-requests-limit: 5